# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/senv | sortetup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Maven

env:
  XX_PROJECT_NAME: "cx-eval-base"
  VERSION_BASE: "1.0"

on:
  workflow_dispatch:
  push:
    branches: [ "develop", "release/*", "task/*", "feature/*", "bugfix/*", "hotfix/*" ]
  
  workflow_run:
    workflows:
      - "Java CI with Maven"
    types: 
      - completed
    
jobs:
  build:
    environment:
      - JAVA_HOME=$JAVA_HOME_21_X64
      
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip-ci]') }}
    permissions:
      contents: write
      packages: write

    steps:
    - name: checkout
      uses: actions/checkout@v3

#    - name: setup java 21
#      uses: actions/setup-java@v3
#      with:
#        java-version: '21'
#        distribution: 'temurin'
#        settings-path: ${{ github.workspace }} # location for the settings.xml file
#        cache: 'maven'

    - name: versioning
      run: |
        . .github/scripts/versioning
        mvn -B versions:set -DnewVersion=$VERSION
        find . -name pom.xml -exec grep version "{}" \;

    - name: build
      run: |
        mvn -B clean install

    - name: deploy
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mvn -B deploy -s $GITHUB_WORKSPACE/settings.xml

    - name: Tag and push current repo code
      run: |
          echo git tag v47.11
          echo git push origin tag v47.11
